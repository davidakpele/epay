<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Maintenance Fee</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 30px auto; background: #fff; border-radius: 8px; overflow: hidden; }
        .header { background: #424242; padding: 28px 32px; text-align: center; }
        .header h1 { color: #fff; margin: 0; font-size: 22px; }
        .body { padding: 32px; }
        .body p { color: #333; font-size: 15px; line-height: 1.7; }
        .info-box { background: #f5f5f5; border-left: 4px solid #424242; padding: 16px 20px; border-radius: 4px; margin: 20px 0; }
        .info-box p { margin: 5px 0; font-size: 14px; }
        .footer { background: #f9f9f9; padding: 18px; text-align: center; font-size: 12px; color: #999; border-top: 1px solid #eee; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>ePay — Maintenance Fee</h1></div>
    <div class="body">
        <p>Dear <strong th:text="${userFirstName}">Customer</strong>,</p>
        <p>A maintenance fee has been deducted from your wallet.</p>
        <div class="info-box">
            <p><strong>Fee Amount:</strong> <span th:text="${currency}">NGN</span> <span th:text="${feeAmount}">0.00</span></p>
            <p><strong>Previous Balance:</strong> <span th:text="${previousBalance}">0.00</span></p>
            <p><strong>New Balance:</strong> <span th:text="${availableBalance}">0.00</span></p>
            <p><strong>Reason:</strong> <span th:text="${reason}">Scheduled maintenance</span></p>
            <p><strong>Date:</strong> <span th:text="${timestamp}">N/A</span></p>
        </div>
        <p>For queries, please contact our support team.</p>
    </div>
    <div class="footer"><p>ePay — Secure Digital Payments</p></div>
</div>
</body>
</html>
