services:
  # ============================================================
  # Infrastructure
  # ============================================================

  postgres:
    image: postgres:16-alpine
    container_name: epay-postgres
    environment:
      POSTGRES_DB: epay
      POSTGRES_USER: ${DB_USERNAME:-epay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-epay}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-epay} -d epay"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - epay-network

  redis:
    image: redis:7-alpine
    container_name: epay-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - epay-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: epay-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - epay-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - epay-network

  # ============================================================
  # Backend — Spring Boot
  # ============================================================

  epay-server:
    build:
      context: ./epay
      dockerfile: Dockerfile
    container_name: epay-server
    image: epay-server:latest
    ports:
      - "8029:8029"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: ${DB_USERNAME:-epay}
      DB_PASSWORD: ${DB_PASSWORD:-epay}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epay
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXNlY3VyZS1kZXYtb25seS1zZWNyZXQta2V5LTMyLWJ5dGVzLWxvbmchISE=}
      SERVER_PORT: 8029
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8029/actuator/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - app_uploads:/var/www/uploads
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================
  # Frontend — Next.js
  # ============================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: epay-frontend
    image: epay-frontend:latest
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      # Point the Next.js app at the backend through the internal network.
      # Override in .env if your app uses a different variable name.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://epay-server:8029}
    depends_on:
      epay-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ============================================================
  # Nginx — reverse proxy for backend + frontend
  # ============================================================

  nginx:
    image: nginx:1.27-alpine
    container_name: epay-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/etc/nginx/html:ro
      - nginx_logs:/var/log/nginx:rw
    depends_on:
      epay-server:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Observability (optional — comment out if not needed)
  # ============================================================

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: epay-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./epay/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      - epay-server
    restart: unless-stopped
    networks:
      - epay-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: epay-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - epay-network

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  app_uploads:
  prometheus_data:
  grafana_data:
  nginx_logs:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  epay-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        - subnet: 172.28.0.0/16
