spring:
  application:
    name: epay-server
  mvc:
    contentnegotiation:
      favor-parameter: false
      favor-path-extension: false
  autoconfigure:
    exclude:
      - org.springframework.boot.cassandra.autoconfigure.CassandraAutoConfiguration
      - org.springframework.boot.cassandra.autoconfigure.CassandraDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.rest.RepositoryRestMvcAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false
  datasource:
    url: jdbc:postgresql://postgres:5432/pesco_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: HikariPool
      max-lifetime: 1200000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        connection:
          provider_disables_autocommit: true
  sql:
    init:
      mode: never
  data:
    rest:
      base-path: /data-rest
    redis:
      host: redis
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
  cloud:
    task:
      initialize-enabled: false
      table-prefix: TASK_
  cassandra:
    contact-points: cassandra
    port: 9042
    local-datacenter: datacenter1
    keyspace-name: epay_keyspace
    username: ${CASSANDRA_USERNAME:cassandra}
    password: ${CASSANDRA_PASSWORD:cassandra}

  devtools:
    restart:
      enabled: false
      exclude: "static/**,public/**"
    livereload:
      enabled: false

  web:
    resources:
      add-mappings: false
      static-locations:
        - classpath:/static/
        - file:/var/www/uploads/images/
  main:
    allow-bean-definition-overriding: true
  security:
    filter:
      dispatcher-types: REQUEST,ERROR,ASYNC
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
      file-size-threshold: 0
      location: /tmp
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  mail:
    host: smtp.gmail.com
    port: 587
    username: akpeledavidprogress@gmail.com
    password: eruxeybiakedfjfp
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

pesco:
  banking:
    service:
      email: artexnetworkservice@gmail.com

file:
  upload-dir: ${FILE_UPLOAD_DIR:/var/www/uploads/images}
  max-file-size: 50MB
  allowed-file-types: image/jpeg,image/png,image/gif,image/webp

web:
  resources:
    static-locations: classpath:/static/
  datasource:
    url: jdbc:postgresql://localhost:5432/epay
    username: ${DB_USERNAME:epay}
    password: ${DB_PASSWORD:epay}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false
epay:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me}
      expiration-ms: 3600000
      expiration-minutes: 30
      refresh-expiration-days: 7
      issuer: "ePay"
      audience: "Unified Dynamic Systems"
      clock-skew-seconds: 30
      algorithm: "HS256"
      token-prefix: "Bearer"
      authorization-header: "Authorization"
      enable-token-blacklist: true
      blacklist-cleanup-interval-minutes: 60
      max-blacklist-size: 10000
      cookie-name: "jwt-token"
      http-only-cookie: true
      secure-cookie: true
      same-site-cookie: "Strict"
      cors-allowed-origins: "http://localhost:3000,http://localhost:8000"
      enable-multi-factor-support: false
      max-tokens-per-user: 5
      log-token-issuance: false
      enable-token-rotation: true
      rotation-grace-period-minutes: 5
      access-token:
        expiration: 900000
      refresh-token:
        expiration: 604800000
  rate-limit:
    # Tier 1 — Global IP guard (all endpoints)
    global-ip-limit: 200
    global-window-seconds: 60
    # Tier 2 — Auth endpoints: /auth/** (login, OTP, register, forgot-password)
    # Tight: prevents brute-force and credential stuffing
    auth-limit: 10
    auth-window-seconds: 60
    # Tier 2 — Wallet endpoints: /wallet/** (transfer, balance, PIN)
    # Tight: prevents financial abuse
    wallet-limit: 30
    wallet-window-seconds: 60
    # Tier 2 — User endpoints: /user/**
    user-limit: 50
    user-window-seconds: 60
    # Progressive penalty: each repeat violation multiplies backoff by this factor
    penalty-multiplier: 3
    # Maximum block duration (1 hour)
    max-penalty-seconds: 3600
    # Number of violations before an IP gets blocked
    suspicious-threshold: 5
  gateways:
    paystack:
      secret-key: ${PAYSTACK_SECRET_KEY:}
    flutterwave:
      secret-key: ${FLUTTERWAVE_SECRET_KEY:}
  cards:
    sudo:
      api-key: ${SUDO_API_KEY:}

geolocation:
  ip-api:
    base-url: http://ip-api.com
    timeout-seconds: 3
  cache:
    max-size: 5000
    expire-hours: 24
