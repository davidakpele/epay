name: Deploy to Production

on:
  # Auto-deploy when both CI workflows pass on main
  workflow_run:
    workflows:
      - Backend CI
      - Frontend CI
    branches: [main]
    types: [completed]

  # Manual trigger with optional image tag override
  workflow_dispatch:
    inputs:
      backend_tag:
        description: 'Backend image tag to deploy (e.g. main-abc1234)'
        required: false
        default: 'latest'
      frontend_tag:
        description: 'Frontend image tag to deploy (e.g. main-abc1234)'
        required: false
        default: 'latest'
      skip_health_check:
        description: 'Skip post-deploy health check'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/epay-server
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/epay-frontend
  DEPLOY_PATH: /opt/epay-app

jobs:
  # Gate: only proceed if ALL triggering CI workflows succeeded
  check-ci-status:
    name: Check CI Status
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Evaluate deploy gate
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy via Docker Compose
    runs-on: ubuntu-latest
    needs: check-ci-status
    if: needs.check-ci-status.outputs.should_deploy == 'true'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BACKEND_TAG="${{ github.event.inputs.backend_tag }}"
            FRONTEND_TAG="${{ github.event.inputs.frontend_tag }}"
          else
            SHORT_SHA="${{ github.event.workflow_run.head_sha }}"
            SHORT_SHA="${SHORT_SHA:0:7}"
            BACKEND_TAG="main-${SHORT_SHA}"
            FRONTEND_TAG="main-${SHORT_SHA}"
          fi
          echo "backend_tag=${BACKEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=${FRONTEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying backend:${BACKEND_TAG}  frontend:${FRONTEND_TAG}"

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy docker-compose and env files to server
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/docker-compose.yml

      - name: Deploy on remote server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -s << 'ENDSSH'
            set -euo pipefail

            cd ${{ env.DEPLOY_PATH }}

            # ── Authenticate to GHCR ─────────────────────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── Pull new images ──────────────────────────────────────────
            docker pull ${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.backend_tag }}
            docker pull ${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.frontend_tag }}

            # ── Tag as :latest so compose picks them up ──────────────────
            docker tag \
              ${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.backend_tag }} \
              ${{ env.BACKEND_IMAGE }}:latest
            docker tag \
              ${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.frontend_tag }} \
              ${{ env.FRONTEND_IMAGE }}:latest

            # ── Rolling restart — backend instances one at a time ────────
            for instance in epay-server-1 epay-server-2 epay-server-3; do
              echo ">>> Restarting ${instance}..."
              docker compose up -d --no-deps --no-recreate "${instance}" || \
                docker compose up -d --no-deps "${instance}"
              # Wait for health before moving to the next instance
              for i in $(seq 1 12); do
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' "${instance}" 2>/dev/null || echo "unknown")
                echo "  [${i}/12] ${instance} health: ${STATUS}"
                if [[ "${STATUS}" == "healthy" ]]; then break; fi
                if [[ "${i}" == "12" ]]; then
                  echo "ERROR: ${instance} did not become healthy in time."
                  exit 1
                fi
                sleep 10
              done
            done

            # ── Rolling restart — frontend instances ─────────────────────
            for instance in epay-frontend-1 epay-frontend-2 epay-frontend-3; do
              echo ">>> Restarting ${instance}..."
              docker compose up -d --no-deps --no-recreate "${instance}" || \
                docker compose up -d --no-deps "${instance}"
              for i in $(seq 1 9); do
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' "${instance}" 2>/dev/null || echo "unknown")
                echo "  [${i}/9] ${instance} health: ${STATUS}"
                if [[ "${STATUS}" == "healthy" ]]; then break; fi
                if [[ "${i}" == "9" ]]; then
                  echo "ERROR: ${instance} did not become healthy in time."
                  exit 1
                fi
                sleep 10
              done
            done

            # ── Reload nginx to pick up any config changes ───────────────
            docker compose up -d --no-deps nginx

            # ── Prune dangling images to reclaim disk space ──────────────
            docker image prune -f

            echo "✅ Deployment complete."
          ENDSSH

      - name: Post-deploy health check
        if: ${{ github.event.inputs.skip_health_check != 'true' }}
        run: |
          PRODUCTION_URL="${{ vars.PRODUCTION_URL }}"
          if [[ -z "${PRODUCTION_URL}" ]]; then
            echo "PRODUCTION_URL variable not set — skipping external health check."
            exit 0
          fi
          echo "Checking ${PRODUCTION_URL}/actuator/health ..."
          for i in $(seq 1 10); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${PRODUCTION_URL}/actuator/health" || echo "000")
            echo "  Attempt ${i}: HTTP ${HTTP_STATUS}"
            if [[ "${HTTP_STATUS}" == "200" ]]; then
              echo "✅ Health check passed."
              exit 0
            fi
            sleep 15
          done
          echo "❌ Health check failed after all retries."
          exit 1

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
