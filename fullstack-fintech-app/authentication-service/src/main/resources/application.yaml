server:
  port: 8187
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

spring:
  application:
    name: authentication-service
  data:
    redis:
      host: redis
      port: 6379
  web:
    resources:
      add-mappings: false
      static-locations:
        - classpath:/static/
        - file:/var/www/uploads/images/ 
  servlet:
    multipart:
      enabled: true
      max-file-size: 2MB
      max-request-size: 2MB
      file-size-threshold: 0
      location: /tmp
  file:
    upload-dir: ${FILE_UPLOAD_DIR:/var/www/uploads/images} 
    max-file-size: 2MB
    allowed-file-types: image/jpeg,image/png,image/gif,image/webp

  main:
    allow-bean-definition-overriding: true
  security:
    filter:
      dispatcher-types: REQUEST,ERROR,ASYNC
  datasource:
    url: jdbc:postgresql://postgres:5432/pesco_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false 
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: HikariPool
      max-lifetime: 1200000 
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        connection:
          provider_disables_autocommit: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  sql:
    init:
      mode: never

file:
  upload-dir: ${FILE_UPLOAD_DIR:/var/www/uploads/images}
  max-file-size: 50MB
  allowed-file-types: image/jpeg,image/png,image/gif,image/webp

