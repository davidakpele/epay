[package]
name = "maintenance-service"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code="forbid"
unused ="allow"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Web framework & HTTP
axum = { version = "0.7", features = ["ws", "json"] }
tower = "0.5.1"
tower-http = { version = "0.6.6", default-features = false, features = ["cors"] }
hyper = { version = "1", features = ["full"] }
http = "1"
http-body-util = "0.1"
vader_sentiment = "0.1"
dotenv = "0.15"
env_logger = "0.11.7"
openssl-probe = "0.1"
serde_json = "1.0"
bincode = "2.0.1"
bytes = "1.0"
thiserror = "2.0.15"
validator = { version = "0.20.0", features = ["derive"] }
dashmap = "6.1.0"
bigdecimal = { version = "0.4", features = ["serde", "serde_json"] }
clap = { version = "4.5.44", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"] }
rand_core = "0.9.3"
async-trait = "0.1"
headers = "0.4"
axum-auth = "0.8.1"
once_cell = "1.19"
futures = "0.3"
num-bigint = { version = "0.4", features = ["serde"] }
num = "0.4"
rand = "0.8"
sha2 = "0.10.9"
hex = "0.4.3"
bs58 = "0.5.0"
# Logging & error handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0.97"
# Auth
jsonwebtoken = "9.2"
argon2 = "0.5" 
password-hash = "0.5"
# Database
sqlx = { version = "0.8.6", features = [
    "postgres",
    "tls-native-tls",
    "runtime-tokio-native-tls",
    "macros",
    "uuid",
    "chrono",
    "migrate",
    "json",  
    "bigdecimal"
] }

uuid = { version = "1.4", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
# Environment variables
dotenvy = "0.15"
# WebSocket utilities
tokio-tungstenite = "0.26.2"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
# OpenAPI + Swagger UI
utoipa = { version = "5.3.0", features = ["axum_extras", "chrono"] }
utoipa-rapidoc = { version = "6.0.0", features = ["axum"] }
serde = { version = "1.0", features = ["derive"] }
indicatif = "0.18.0"
console = { version = "0.16", features = ["std"] }
insta = { version = "1.41", features = ["json"] }
# Github auth2
oauth2 = "4.4.1"
redis = { version = "0.24", features = ["aio", "tokio-comp"] }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.7.0"
tokio = { version = "1.0", features = ["full", "rt-multi-thread", "macros"] }
tempfile = "3.3"
http = "1"
http-body-util = "0.1"
hyper = "1"
tower-service = "0.3"
tower-layer = "0.3.2"
paste = "1.0"

[package.metadata.docs.rs]
features = []
rustdoc-args = ["--cfg", "doc_cfg"]

[features]
default = []
ttl = []
lsm = []
binary-protocol = []
replication = []
persistence = []
full = []