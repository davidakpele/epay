# API Routes - Deposit Service
location /v1/deposit/ {
    # Strict rate limiting
    limit_req zone=strict_limit burst=10 nodelay;
    limit_req zone=txn_limit burst=3 nodelay;
    limit_req zone=per_user burst=5 nodelay;
    limit_req_status 429;
    
    # Method restriction
    if ($request_method !~ ^(POST|GET|OPTIONS)$) {
        return 405;
    }
    
    # Require referer for POST
    set $referer_check 0;
    if ($request_method = POST) {
        set $referer_check 1;
    }
    if ($http_referer != "") {
        set $referer_check 0;
    }
    if ($referer_check = 1) {
        return 403 '{"error":"Missing referer header"}';
    }

    # Attack pattern detection
    if ($request_uri ~* "(union[\s\+]+select|insert[\s\+]+into|delete[\s\+]+from|drop[\s\+]+table|exec[\s\+]*\(|script>|onerror=|javascript:|base64_decode|phpinfo|\.\.\/|<\s*script|<\s*iframe|onmouseover|onload=)" ) {
        access_log /var/log/nginx/attacks.log security_log;
        return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED"}';
    }

    proxy_pass http://deposit_service/deposit/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;
    proxy_redirect off;
    
    # Enhanced logging for deposits
    access_log /var/log/nginx/transactions.log security_log;
}

# API Routes - Withdrawal Service
location /v1/withdrawals/ {
    # Strict rate limiting
    limit_req zone=strict_limit burst=10 nodelay;
    limit_req zone=txn_limit burst=3 nodelay;
    limit_req zone=per_user burst=5 nodelay;
    limit_req_status 429;
    
    if ($request_method !~ ^(POST|GET|OPTIONS)$) {
        return 405;
    }
    
    # Require referer for POST
    set $referer_check 0;
    if ($request_method = POST) {
        set $referer_check 1;
    }
    if ($http_referer != "") {
        set $referer_check 0;
    }
    if ($referer_check = 1) {
        return 403 '{"error":"Missing referer header"}';
    }
    
    # Attack detection
    if ($request_uri ~* "(union.*select|insert.*into|delete.*from|script>|javascript:)") {
        access_log /var/log/nginx/attacks.log security_log;
        return 403 '{"error":"Attack pattern detected"}';
    }
    
    proxy_pass http://withdraw_service/api/withdrawals/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;
    proxy_redirect off;
    
    access_log /var/log/nginx/transactions.log security_log;
}
