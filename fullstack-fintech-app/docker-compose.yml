services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: banking-postgres
    environment:
      POSTGRES_DB: pesco_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  mysql:
    image: mysql:8.0
    container_name: banking-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: banking_db
      MYSQL_USER: banking_user
      MYSQL_PASSWORD: banking_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - banking-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - banking-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - banking-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - banking-network

  # ===========================
  # NGINX Gateway Service
  # ===========================
  nginx:
    image: nginx:alpine
    container_name: nginx-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    ports:
      - "8000:8000"
    volumes:
      - ./security-firewalls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./security-firewalls/conf.d:/etc/nginx/conf.d:ro
      - ./security-firewalls/html:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx:rw
      - nginx_cache:/var/cache/nginx:rw
      - nginx_run:/var/run:rw
    depends_on:
      - authentication-service
      - wallet-service
      - deposit-service
      - withdraw-service
      - revenue-service
      - notification-service
      - escrow-service
      - admin-api-service 
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - TZ=UTC
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    networks:
      - banking-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=nginx"
 
  # Spring Boot Services
  authentication-service:
    build: ./authentication-service
    container_name: authentication-service
    image: davidakpele/authentication-service:latest
    ports:
      - "8187:8187"
    volumes:
      - ./uploads/auth:/var/www/uploads/images
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - FILE_UPLOAD_DIR=/var/www/uploads/images
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      - postgres
      - rabbitmq
      - notification-service
      - wallet-service
      - redis
    networks:
    - banking-network

  withdraw-service:
    build: ./withdraw-service
    container_name: withdraw-service
    image: davidakpele/withdraw-service:latest
    ports:
      - "8068:8068"
    depends_on:
      - wallet-service
      - resiliences-service
      - revenue-service
      - notification-service
      - authentication-service
      - escrow-service
    networks:
      - banking-network

  wallet-service:
    restart: unless-stopped
    build: ./wallet-service
    container_name: wallet-service
    image: davidakpele/wallet-service:latest
    ports:
      - "8035:8035"
      - "9090:9090"
    environment:
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379 
    depends_on:
      - postgres
      - resiliences-service
      - notification-service
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8035/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - banking-network

  deposit-service:
    build: ./deposit-service
    container_name: deposit-service
    image: davidakpele/deposit-service:latest
    ports:
      - "8020:8020"
    depends_on:
      - resiliences-service
      - wallet-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8035/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - banking-network

  virtual-card-service:
    build: ./virtual-card-service
    container_name: virtual-card-service
    image: davidakpele/virtual-card-service:latest
    ports:
      - "8037:8037"
    depends_on:
      postgres:
        condition: service_healthy  # Wait for postgres to be healthy
      resiliences-service:
        condition: service_started
      wallet-service:
        condition: service_started
      authentication-service:
        condition: service_started
      notification-service:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/pesco_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8037/actuator/health"]  # Fixed port
      interval: 30s
      timeout: 10s
      retries: 5  # Increased retries
      start_period: 90s  # More time for Spring Boot startup
    networks:
      - banking-network
  
  revenue-service:
    build: ./revenue-service
    container_name: revenue-service
    image: davidakpele/revenue-service:latest
    ports:
      - "8083:8083"
    env_file:
      - ./revenue-service/.env
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - banking-network
 
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    image: davidakpele/api-gateway:latest
    ports:
      - "8292:8292"
    environment:
      - PORT=8292
      - BACKEND_URL=http://host.docker.internal:8000/v1
      - BACKEND_WS_URL=ws://host.docker.internal:8000/v1/ws
      - RATE_LIMIT_PER_MINUTE=100
      - NODE_ENV=production
      - ZIPKIN_BASE_URL=http://zipkin:9411
    restart: unless-stopped
    depends_on:
      - zipkin
    networks:
      - banking-network
     
  escrow-service:
    build: ./escrow-service
    container_name: escrow-service
    image: davidakpele/escrow-service:latest
    ports:
      - "8755:8755"
    depends_on:
      - postgres
      - notification-service
      - wallet-service
      - resiliences-service
      - authentication-service
    networks:
      - banking-network

  notification-service:
    build: ./notification-service
    container_name: notification-service
    image: davidakpele/notification-service:latest
    ports:
      - "8079:8079"
    depends_on:
      rabbitmq:
        condition: service_healthy 
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    networks:
      - banking-network
  
  resiliences-service:
    restart: unless-stopped
    build: ./resiliences-service
    container_name: resiliences-service  
    image: davidakpele/resiliences-service:latest
    ports:
      - "8531:8531"  
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8531
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pesco_db;Username=postgres;Password=root
      - Redis__ConnectionString=redis:6379,abortConnect=false
      - ServiceUrls__UserService=http://authentication-service:8187
      - ServiceUrls__WalletService=http://wallet-service:8035
      - ServiceUrls__RevenueService=http://revenue-service:8083
      - ServiceUrls__NotificationService=http://notification-service:8079
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8531/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - banking-network

  admin-api-service:
    build: ./admin-api-service
    container_name: admin-api-service
    image: davidakpele/admin-api-service:latest
    ports:
      - "8109:8109"
    volumes:
      - ./uploads/auth:/var/www/uploads/images
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - FILE_UPLOAD_DIR=/var/www/uploads/images
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      - postgres
      - notification-service
      - authentication-service
      - resiliences-service
      - withdraw-service
      - wallet-service
      - deposit-service
      - revenue-service
      - escrow-service
      - redis
    networks:
    - banking-network

  frontend:
    build: ./frontend
    container_name: banking-frontend
    image: davidakpele/banking-frontend:latest
    ports:
      - "3000:3000"
    networks:
      - banking-network
 
volumes:
  postgres_data:
  mysql_data:
  redis_data:
  nginx_logs:
    driver: local
  nginx_cache:
    driver: local
  nginx_run:
    driver: local

networks:
  banking-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16