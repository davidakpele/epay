<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Your Username</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 30px auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .header { background: #1a237e; padding: 28px 32px; text-align: center; }
        .header h1 { color: #fff; margin: 0; font-size: 22px; }
        .body { padding: 32px; }
        .body p { color: #333; font-size: 15px; line-height: 1.7; }
        .username-box { background: #e8eaf6; border: 2px solid #1a237e; padding: 16px 20px; text-align: center; border-radius: 6px; margin: 24px 0; font-size: 22px; font-weight: bold; color: #1a237e; letter-spacing: 2px; }
        .footer { background: #f9f9f9; padding: 18px 32px; text-align: center; font-size: 12px; color: #999; border-top: 1px solid #eee; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>ePay — Your Username</h1></div>
    <div class="body">
        <p>Dear <strong th:text="${fullName}">Customer</strong>,</p>
        <p>You requested your ePay username. Here it is:</p>
        <div class="username-box" th:text="${username}">username</div>
        <p>You can use this username to log in to your ePay account.</p>
        <p>If you did not request this, please contact support immediately.</p>
    </div>
    <div class="footer"><p>This is an automated message from ePay. Do not reply.</p></div>
</div>
</body>
</html>
