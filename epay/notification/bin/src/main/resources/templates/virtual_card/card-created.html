<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><title>Card Created</title>
    <style>
        body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:0}
        .container{max-width:600px;margin:30px auto;background:#fff;border-radius:8px;overflow:hidden}
        .header{background:#1a237e;padding:28px 32px;text-align:center}
        .header h1{color:#fff;margin:0;font-size:22px}
        .body{padding:32px}.body p{color:#333;font-size:15px;line-height:1.7}
        .info-box{background:#e8eaf6;border-left:4px solid #1a237e;padding:16px 20px;border-radius:4px;margin:20px 0}
        .info-box p{margin:5px 0;font-size:14px}
        .footer{background:#f9f9f9;padding:18px;text-align:center;font-size:12px;color:#999;border-top:1px solid #eee}
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>ePay — Virtual Card Created</h1></div>
    <div class="body">
        <p>Dear <strong th:text="${fullName}">Customer</strong>,</p>
        <p>Your virtual card has been created successfully and is ready for use.</p>
        <div class="info-box">
            <p><strong>Card Type:</strong> <span th:text="${cardType}">VISA</span></p>
            <p><strong>Card (last 4):</strong> **** **** **** <span th:text="${last4}">0000</span></p>
            <p><strong>Currency:</strong> <span th:text="${currency}">USD</span></p>
            <p><strong>Created On:</strong> <span th:text="${createdOn}">N/A</span></p>
        </div>
        <p>Keep your card details secure and never share them with anyone.</p>
    </div>
    <div class="footer"><p>ePay — Secure Digital Payments</p></div>
</div>
</body>
</html>
