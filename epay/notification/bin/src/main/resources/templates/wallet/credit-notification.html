<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Funds Received</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: 30px auto;
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
      }
      .header {
        background: #1b5e20;
        padding: 28px 32px;
        text-align: center;
      }
      .header h1 {
        color: #fff;
        margin: 0;
        font-size: 22px;
      }
      .body {
        padding: 32px;
      }
      .body p {
        color: #333;
        font-size: 15px;
        line-height: 1.7;
      }
      .amount-box {
        background: #e8f5e9;
        border-left: 4px solid #1b5e20;
        padding: 16px 20px;
        border-radius: 4px;
        margin: 20px 0;
      }
      .amount-box p {
        margin: 5px 0;
        font-size: 14px;
      }
      .footer {
        background: #f9f9f9;
        padding: 18px;
        text-align: center;
        font-size: 12px;
        color: #999;
        border-top: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header"><h1>ePay — Funds Received</h1></div>
      <div class="body">
        <p>Dear <strong th:text="${receiverFullName}">Customer</strong>,</p>
        <p>You have received a transfer to your ePay wallet.</p>
        <div class="amount-box">
          <p>
            <strong>Amount:</strong>
            <span th:text="${transferAmount}">NGN 0.00</span>
          </p>
          <p>
            <strong>From:</strong>
            <span th:text="${senderFullName}">Sender</span>
          </p>
          <p>
            <strong>Previous Balance:</strong>
            <span th:text="${previousBalance}">NGN 0.00</span>
          </p>
          <p>
            <strong>New Balance:</strong>
            <span th:text="${recipientTotalBalance}">NGN 0.00</span>
          </p>
          <p>
            <strong>Transaction ID:</strong>
            <span th:text="${transactionId}">N/A</span>
          </p>
        </div>
        <p>
          If you did not expect this transfer, please contact support
          immediately.
        </p>
      </div>
      <div class="footer"><p>ePay — Secure Digital Payments</p></div>
    </div>
  </body>
</html>
