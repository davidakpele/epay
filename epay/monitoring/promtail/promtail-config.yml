server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ── ePay audit log (structured JSON, one object per line) ─────────────
  - job_name: epay-audit
    static_configs:
      - targets: [localhost]
        labels:
          job: epay-audit
          service: epay-server
          environment: production
          __path__: /var/log/epay/audit.log

    pipeline_stages:
      # Each line is already a complete JSON object — parse it
      - json:
          expressions:
            requestId: requestId
            timestamp: timestamp
            method: method
            uri: uri
            status: status
            latencyMs: latencyMs
            authenticated: authenticated
            username: username
            roles: roles
            ip: ip
            device: device
            location: location
            userAgent: userAgent
            blocked: blocked

      # Promote fields to Loki labels (low-cardinality ones only)
      - labels:
          method:
          status:
          authenticated:
          blocked:
          device:

      # Use the request's own timestamp as the log timestamp
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339

      # Keep full JSON as the log line
      - output:
          source: _entry

  # ── ePay application log (plain text) ─────────────────────────────────
  - job_name: epay-app
    static_configs:
      - targets: [localhost]
        labels:
          job: epay-app
          service: epay-server
          environment: production
          __path__: /var/log/epay/app.log

    pipeline_stages:
      - regex:
          expression: '^(?P<log_timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\s+\[(?P<thread>[^\]]+)\]\s+(?P<level>\S+)\s+(?P<logger>\S+)\s+-\s+(?P<message>.*)$'
      - labels:
          level:
          logger:
      - drop:
          expression: ".*"
          if: 'level == "DEBUG" || level == "TRACE"'
