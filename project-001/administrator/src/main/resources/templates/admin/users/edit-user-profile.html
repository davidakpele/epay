<script>
/* =============================================================
   EDIT USER  —  fetch + populate + submit
   URL pattern: /admin/user/{id}/edit
   ============================================================= */

const EDIT_API_BASE = "http://localhost:8292/api";

/* Linked field pairs (compact panel id → expanded section id) */
const LINKED_FIELDS = [
    ['c_fullName',      'fullName'],
    ['c_gender',        'gender'],
    ['c_dob',           'dob'],
    ['c_kycStatus',     'kycStatus'],
    ['c_accountStatus', 'accountStatus'],
    ['c_email',         'email'],
    ['c_phone',         'phone'],
    ['c_address',       'address'],
    ['c_nationality',   'nationality'],
];

/* Keep both panels in sync as user types */
LINKED_FIELDS.forEach(function(pair) {
    var compactId = pair[0], expandedId = pair[1];
    document.addEventListener('DOMContentLoaded', function() {
        var compactEl  = document.getElementById(compactId);
        var expandedEl = document.getElementById(expandedId);
        if (!compactEl || !expandedEl) return;
        compactEl.addEventListener('input',  function() { expandedEl.value = compactEl.value; });
        compactEl.addEventListener('change', function() { expandedEl.value = compactEl.value; });
        expandedEl.addEventListener('input',  function() { compactEl.value = expandedEl.value; });
        expandedEl.addEventListener('change', function() { compactEl.value = compactEl.value; });
    });
});

/* 1. Extract userId from URL */
function getUserIdFromUrl() {
    var match = window.location.pathname.match(/\/admin\/user\/([^/]+)\/edit/);
    return match ? match[1] : null;
}

/* 2. Fetch user */
async function fetchUserForEdit(userId) {
    var token = localStorage.getItem('access_token');
    var response = await fetch(EDIT_API_BASE + '/user/' + userId, {
        headers: Object.assign(
            { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            token ? { 'Authorization': 'Bearer ' + token } : {}
        )
    });
    if (!response.ok) {
        var err = await response.json().catch(function() { return {}; });
        throw new Error(err.message || 'HTTP Error: ' + response.status);
    }
    return response.json();
}

/* 3. Helpers */
function setVal(id, value) {
    var el = document.getElementById(id);
    if (!el) return;
    el.value = value || '';
    el.classList.remove('loading');
}

function setSelectVal(id, value) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('loading');
    if (!value) return;
    var upper = value.toString().toUpperCase();
    for (var i = 0; i < el.options.length; i++) {
        if (el.options[i].value.toUpperCase() === upper ||
            el.options[i].text.toUpperCase()  === upper) {
            el.selectedIndex = i;
            break;
        }
    }
}

function formatDateForInput(ds) {
    if (!ds) return '';
    /* Accept ISO strings and dd/MM/yyyy */
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(ds)) {
        var parts = ds.split('/');
        return parts[2] + '-' + parts[1] + '-' + parts[0]; /* yyyy-MM-dd */
    }
    var d = new Date(ds);
    if (isNaN(d)) return '';
    return d.toISOString().split('T')[0];
}

function formatDateTimeDisplay(ds) {
    if (!ds) return 'N/A';
    return new Date(ds).toLocaleString('en-US', {
        year: 'numeric', month: 'long', day: 'numeric',
        hour: 'numeric', minute: '2-digit', hour12: true
    });
}

/* 4. Populate all fields */
function populateForm(data) {
    var profile  = (Array.isArray(data.records) && data.records.length > 0) ? data.records[0] : {};
    var fullName = [profile.firstName, profile.lastName].filter(Boolean).join(' ') || data.username || 'N/A';

    /* Strip header */
    var stripName = document.getElementById('stripName');
    if (stripName) stripName.textContent = fullName;

    /* Avatar (strip + main) */
    if (profile.photo) {
        var imgHtml = '<img src="' + profile.photo + '" alt="' + fullName + '" onerror="this.style.display=\'none\'">';
        var stripAv = document.getElementById('stripAvatar');
        var mainAv  = document.getElementById('mainAvatar');
        if (stripAv) stripAv.innerHTML = imgHtml;
        if (mainAv)  mainAv.innerHTML  = imgHtml;
    }

    /* Meta */
    var metaId = document.getElementById('metaUserId');
    if (metaId) metaId.textContent = data.id || 'N/A';
    var metaCreated = document.getElementById('metaCreatedOn');
    if (metaCreated) metaCreated.textContent = formatDateTimeDisplay(data.createdOn);

    /* Active toggle */
    var toggle = document.getElementById('activeToggle');
    if (toggle) {
        if (data.enabled) { toggle.classList.add('on'); } else { toggle.classList.remove('on'); }
    }

    /* Back / cancel links */
    var backBtn   = document.getElementById('backBtn');
    var cancelBtn = document.getElementById('cancelBtn');
    var viewUrl   = '/admin/user/' + data.id + '/view';
    if (backBtn)   backBtn.href   = viewUrl;
    if (cancelBtn) cancelBtn.href = viewUrl;

    /* Populate both compact and expanded fields */
    var dobFormatted = formatDateForInput(profile.dateOfBirth);
    var kycVal   = profile.isTransferPinSet ? 'VERIFIED' : 'PENDING';
    var statVal  = profile.isBlocked ? 'BLOCKED' : (data.enabled ? 'ACTIVE' : 'INACTIVE');
    var natVal   = profile.nationality || '';
    var emailVal = profile.email || data.email || '';

    /* Compact */
    setVal('c_fullName',      fullName);
    setSelectVal('c_gender',        profile.gender);
    setVal('c_dob',           dobFormatted);
    setSelectVal('c_kycStatus',     kycVal);
    setSelectVal('c_accountStatus', statVal);
    setVal('c_email',         emailVal);
    setVal('c_phone',         profile.phoneNumber || profile.phone || '');
    setVal('c_address',       profile.address || '');
    setSelectVal('c_nationality', natVal);

    /* Expanded */
    setVal('fullName',      fullName);
    setSelectVal('gender',        profile.gender);
    setVal('dob',           dobFormatted);
    setSelectVal('kycStatus',     kycVal);
    setSelectVal('accountStatus', statVal);
    setVal('email',         emailVal);
    setVal('phone',         profile.phoneNumber || profile.phone || '');
    setVal('address',       profile.address || '');
    setSelectVal('nationality', natVal);

    /* Remove all loading states on selects too */
    document.querySelectorAll('.eud-select.loading, .eud-input.loading').forEach(function(el) {
        el.classList.remove('loading');
    });
}

/* 5. Handle photo change preview */
function handlePhotoChange(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        var imgHtml = '<img src="' + e.target.result + '" alt="Preview">';
        var stripAv = document.getElementById('stripAvatar');
        var mainAv  = document.getElementById('mainAvatar');
        if (stripAv) stripAv.innerHTML = imgHtml;
        if (mainAv)  mainAv.innerHTML  = imgHtml;
    };
    reader.readAsDataURL(file);
}

/* 6. Build payload from expanded form (source of truth) */
function buildPayload(userId) {
    return {
        id:        userId,
        fullName:  document.getElementById('fullName').value.trim(),
        gender:    document.getElementById('gender').value,
        dob:       document.getElementById('dob').value,
        kycStatus: document.getElementById('kycStatus').value,
        status:    document.getElementById('accountStatus').value,
        email:     document.getElementById('email').value.trim(),
        phone:     document.getElementById('phone').value.trim(),
        address:   document.getElementById('address').value.trim(),
        nationality: document.getElementById('nationality').value,
        enabled:   document.getElementById('activeToggle').classList.contains('on'),
    };
}

/* 7. Validate */
function validateForm() {
    var required = [
        { id: 'fullName',      label: 'Full Name' },
        { id: 'gender',        label: 'Gender' },
        { id: 'dob',           label: 'Date of Birth' },
        { id: 'kycStatus',     label: 'KYC Status' },
        { id: 'accountStatus', label: 'Account Status' },
    ];
    for (var i = 0; i < required.length; i++) {
        var el = document.getElementById(required[i].id);
        if (!el || !el.value.trim()) {
            showToast(required[i].label + ' is required.', true);
            if (el) { el.focus(); el.style.borderColor = '#dd4b39'; }
            return false;
        }
        if (el) el.style.borderColor = '';
    }
    return true;
}

/* 8. Submit */
async function submitEditForm() {
    if (!validateForm()) return;
    var userId = getUserIdFromUrl();
    if (!userId) { showToast('No user ID found in URL.', true); return; }

    var payload = buildPayload(userId);
    var token   = localStorage.getItem('access_token');

    try {
        var response = await fetch(EDIT_API_BASE + '/user/' + userId, {
            method: 'PUT',
            headers: Object.assign(
                { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                token ? { 'Authorization': 'Bearer ' + token } : {}
            ),
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            var err = await response.json().catch(function() { return {}; });
            throw new Error(err.message || 'Save failed: HTTP ' + response.status);
        }

        showToast('User updated successfully!');
        setTimeout(function() {
            window.location.href = '/admin/user/' + userId + '/view';
        }, 1400);

    } catch (e) {
        showToast(e.message, true);
    }
}

/* 9. Toast */
function showToast(message, isError) {
    var existing = document.querySelector('.eud-toast');
    if (existing) existing.remove();
    var toast = document.createElement('div');
    toast.className = 'eud-toast' + (isError ? ' error' : '');
    toast.innerHTML = '<i class="fa ' + (isError ? 'fa-exclamation-triangle' : 'fa-check-circle') + '"></i> ' + message;
    document.body.appendChild(toast);
    setTimeout(function() { if (toast.parentNode) toast.remove(); }, 3500);
}

/* 10. Error banner */
function showEditError(message) {
    var content = document.querySelector('.content');
    if (!content) return;
    var banner = document.createElement('div');
    banner.className = 'eud-error-banner';
    banner.innerHTML = '<strong><i class="fa fa-exclamation-triangle"></i> Could not load user:</strong> ' + message;
    content.insertBefore(banner, content.firstElementChild);
}

/* 11. Boot */
document.addEventListener('DOMContentLoaded', async function() {
    var userId = getUserIdFromUrl();
    if (!userId) { showEditError('No user ID found in URL.'); return; }

    try {
        var data = await fetchUserForEdit(userId);
        populateForm(data);
    } catch (e) {
        showEditError(e.message);
        /* Remove loading states even on error */
        document.querySelectorAll('.eud-skeleton, .loading').forEach(function(el) {
            el.classList.remove('loading');
        });
    }
});
</script>
