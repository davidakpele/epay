spring:
  application:
    name: administrator
  session:
    timeout: 1800  
    cookie:
      http-only: true
      secure: false  
      same-site: strict

  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false
  data:
    redis:
      host: redis
      port: 6379
  web:
    resources:
      add-mappings: false
  main:
    allow-bean-definition-overriding: true
  security:
      filter:
        dispatcher-types: REQUEST,ERROR,ASYNC


  datasource:
    url: jdbc:mysql://mysql:3306/banking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: banking_user
    password: banking_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    # url: jdbc:postgresql://localhost:5432/pesco_db
    # username: postgres
    # password: root
    # driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false 
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: HikariPool
      max-lifetime: 1200000 
      leak-detection-threshold: 60000  
  jpa:
    hibernate:
      ddl-auto: update 
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect 
        # dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        connection:
          provider_disables_autocommit: true
          
  # Thymeleaf Configuration
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

# gRPC Configuration
grpc:
  server:
    port: 9090

# Server Configuration
server:
  port: 8109
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false
        same-site: strict
  
jwt:
  secret-key: 
  expiration-minutes: 30
  refresh-expiration-days: 7
  issuer: "Unified Dynamic Systems"
  audience: "UD49-Stations-app"
  clock-skew-seconds: 30
  algorithm: "HS256"
  token-prefix: "Bearer"
  authorization-header: "Authorization"
  enable-token-blacklist: true
  blacklist-cleanup-interval-minutes: 60
  max-blacklist-size: 10000
  cookie-name: "jwt-token"
  http-only-cookie: true
  secure-cookie: true
  same-site-cookie: "Strict"
  cors-allowed-origins: "http://localhost:3000,http://localhost:8000"
  enable-multi-factor-support: false
  max-tokens-per-user: 5
  log-token-issuance: false
  enable-token-rotation: true
  rotation-grace-period-minutes: 5
  access-token:
    expiration: 900000
  refresh-token:
    expiration: 604800000
  
file:
  upload-dir: src/main/resources/static/image

web:
  resources:
    static-locations: classpath:/static/
  
revenue-service:
  base-url: http://revenue-service:8083
  
blacklist-service:
  base-url: http://blacklist-service:8013

maintenance-service:
  base-url: http://maintenance-service:8086 
  
history-service:
  base-url: http://history-service:8390

wallet-service:
  base-url: http://wallet-service:8035

wallet-websocket:
  url: ws://wallet-service:8035/ws/wallet

auth-service:
  base-url: http://authentication-service:8187

banklist-service:
  base-url: http://banklist-service:8040

notification-service:
  base-url: http://notification-service:8079

escrow-service:
  base-url: http://escrow-service:8755

logging:
  level:
    com.mouad.movieservice: DEBUG
    org.springframework.web: DEBUG
    com.example.demo: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    

spring.sql.init.mode: never

nginx:
  base-url: http://localhost:8000
  admin-path: /admin