<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account Verified</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Inter", sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px; /* helps on small screens */
    color: #f8fafc;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.06);
    padding: 40px 28px;
    text-align: center;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 6px 35px rgba(0, 0, 0, 0.45);
    animation: fadeUp 0.6s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .icon-wrap {
    width: 110px;
    height: 110px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(135deg, #22c55e, #4ade80);
    box-shadow: 0 10px 30px rgba(34, 197, 94, 0.35);
    position: relative;
  }

  /* pulse animation around the circle */
  .icon-wrap::after {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 4px solid rgba(34, 197, 94, 0.35);
    animation: pulse 2s ease-out infinite;
  }

  @keyframes pulse {
    0%   { transform: scale(0.8); opacity: 1; }
    100% { transform: scale(1.4); opacity: 0; }
  }

  svg {
    width: 60px;
    height: 60px;
    stroke: #fff;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  h1 {
    margin-bottom: 8px;
    font-size: 22px;
    font-weight: 700;
  }

  p {
    color: #cbd5e1;
    font-size: 15px;
    line-height: 1.45;
  }

  /* RESPONSIVENESS */

  /* small devices */
  @media (max-width: 480px) {
    .card {
      padding: 28px 20px;
      border-radius: 16px;
    }

    .icon-wrap {
      width: 90px;
      height: 90px;
    }

    svg {
      width: 48px;
      height: 48px;
      stroke-width: 5;
    }

    h1 {
      font-size: 20px;
    }

    p {
      font-size: 14px;
    }
  }

  /* extra large screens */
  @media (min-width: 1200px) {
    .card {
      max-width: 480px;
      padding: 48px 32px;
    }

    .icon-wrap {
      width: 120px;
      height: 120px;
    }
  }

</style>
</head>
<body>

<div class="card">
  <div class="icon-wrap">
    <svg viewBox="0 0 52 52">
      <path d="M14 27 l8 8 l16 -18"></path>
    </svg>
  </div>

  <h1>Account Verified</h1>
  <p>Your account has been successfully verified.</p>
</div>

</body>
</html>
