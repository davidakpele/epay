# ============================================================
# Error Pages & Named Error Locations
# All responses are JSON — this is a pure API backend.
# ============================================================

# -------------------------------------------------------
# Global error_page directives
# -------------------------------------------------------
error_page 400             = @bad_request;
error_page 401             = @unauthorized;
error_page 403             = @forbidden;
error_page 404             = @not_found;
error_page 405             = @method_not_allowed;
error_page 408             = @request_timeout;
error_page 429             = @too_many_requests;
error_page 500 502 503 504 = @service_unavailable;

# -------------------------------------------------------
# Named locations — all internal
# -------------------------------------------------------

location @bad_request {
    internal;
    default_type application/json;
    add_header Content-Type application/json always;
    return 400 '{"success":false,"status":400,"error":"Bad Request","message":"The request could not be understood by the server.","request_id":"$req_id"}';
}

location @unauthorized {
    internal;
    default_type application/json;
    add_header Content-Type application/json always;
    add_header WWW-Authenticate 'Bearer realm="epay"' always;
    return 401 '{"success":false,"status":401,"error":"Unauthorized","message":"Authentication is required to access this resource.","request_id":"$req_id"}';
}

location @forbidden {
    internal;
    default_type application/json;
    add_header Content-Type application/json always;
    return 403 '{"success":false,"status":403,"error":"Forbidden","message":"You do not have permission to access this resource.","request_id":"$req_id"}';
}

location @not_found {
    internal;
    default_type application/json;
    add_header Content-Type application/json always;
    return 404 '{"success":false,"status":404,"error":"Not Found","message":"The requested resource was not found.","request_id":"$req_id"}';
}

location @method_not_allowed {
    internal;
    default_type application/json;
    add_header Content-Type application/json always;
    return 405 '{"success":false,"status":405,"error":"Method Not Allowed","message":"The HTTP method is not supported for this endpoint.","request_id":"$req_id"}';
}

location @request_timeout {
    internal;
    default_type application/json;
    add_header Content-Type application/json always;
    return 408 '{"success":false,"status":408,"error":"Request Timeout","message":"The request took too long to process.","request_id":"$req_id"}';
}

location @too_many_requests {
    internal;
    default_type application/json;
    add_header Content-Type application/json always;
    add_header Retry-After 60 always;
    return 429 '{"success":false,"status":429,"error":"Too Many Requests","message":"Rate limit exceeded. Please wait before retrying.","retry_after":60,"request_id":"$req_id"}';
}

location @service_unavailable {
    internal;
    default_type application/json;
    add_header Content-Type application/json always;
    add_header Retry-After 30 always;
    return 503 '{"success":false,"status":503,"error":"Service Unavailable","message":"The service is temporarily unavailable. Please try again shortly.","retry_after":30,"request_id":"$req_id"}';
}

location @user_blocked {
    internal;
    default_type application/json;
    add_header Content-Type application/json always;
    return 403 '{"success":false,"status":403,"error":"Forbidden","message":"Your request has been blocked by the security policy.","request_id":"$req_id"}';
}
