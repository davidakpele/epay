        if ($request_uri ~* "(<script|javascript:|onerror=|onload=|eval\s*[(]|alert\s*[(])") {
            return 403 '{"error":"XSS detected","code":"XSS_BLOCKED","request_id":"$req_id"}';
        }

        limit_req zone=user_api_limit burst=20 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,PATCH,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS)$) {
            return 405 '{"error":"Method not allowed","code":"METHOD_NOT_ALLOWED","request_id":"$req_id"}';
        }

        client_max_body_size  10M;
        client_body_buffer_size 128k;

        rewrite ^/api/v1/(.*)$ /$1 break;

        proxy_pass            http://epay_backend;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID $req_id;
        proxy_redirect        off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        access_log /var/log/nginx/user.log security_log;
        error_page 502 503 504 = @service_unavailable;
    }

