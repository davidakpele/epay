# =============================================================
# Main Server Block
# Convention: clients use /api/v1/<service>/...
#             nginx strips /api/v1 → Spring Boot sees /<service>/...
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    limit_conn conn_limit 50;
    add_header X-Request-ID $req_id always;

    # ----------------------------------------------------------
    # Swagger / OpenAPI  (no /api/v1 prefix)
    # ----------------------------------------------------------
    include /etc/nginx/conf.d/swagger-locations.conf;

    # ----------------------------------------------------------
    # Actuator health
    # ----------------------------------------------------------
    location /actuator/health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        proxy_pass         http://epay_backend/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # ----------------------------------------------------------
    # Nginx health
    # ----------------------------------------------------------
    location = /health {
        access_log off;
        return 200 '{"status":"healthy","service":"nginx"}';
        add_header Content-Type application/json;
    }

    # ----------------------------------------------------------
    # Webhooks — no /api/v1 prefix, HMAC-authenticated in app
    # ----------------------------------------------------------
    location /webhook/ {
        if ($request_method != POST) { return 405; }
        client_max_body_size 50k;
        proxy_pass         http://epay_backend/webhook/;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID $req_id;
        proxy_redirect     off;
        access_log /var/log/nginx/webhooks.log security_log;
        error_page 502 503 504 = @service_unavailable;
    }

    # ----------------------------------------------------------
    # AUTH  →  /api/v1/auth/...  →  /auth/...
    # ----------------------------------------------------------
    location /api/v1/auth/ {
        if ($is_malicious) {
            access_log /var/log/nginx/security_blocked.log security_log;
            add_header Content-Type application/json always;
            return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED","request_id":"$req_id"}';
        }
        if ($request_uri ~* "(\.\./|\.\.[\\\\]|/etc/|/proc/|\.git|\.env|passwd|shadow)") {
            return 403 '{"error":"Path traversal detected","code":"PATH_TRAVERSAL_BLOCKED","request_id":"$req_id"}';
        }
        if ($request_uri ~* "(union.*select|insert.*into|drop.*table|waitfor.*delay|sleep\s*[(])") {
            return 403 '{"error":"SQL injection detected","code":"SQLI_BLOCKED","request_id":"$req_id"}';
        }
        if ($request_uri ~* "(<script|javascript:|onerror=|onload=|eval\s*[(]|alert\s*[(])") {
            return 403 '{"error":"XSS detected","code":"XSS_BLOCKED","request_id":"$req_id"}';
        }
        if ($http_user_agent ~* (nikto|sqlmap|masscan|nessus|openvas)) {
            return 403 '{"error":"Scanner blocked","code":"SCANNER_BLOCKED","request_id":"$req_id"}';
        }

        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET,POST,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        if ($request_method !~ ^(GET|POST|OPTIONS)$) {
            return 405 '{"error":"Method not allowed","code":"METHOD_NOT_ALLOWED","request_id":"$req_id"}';
        }

        client_max_body_size 10k;
        client_body_buffer_size 10k;

        rewrite ^/api/v1/(.*)$ /$1 break;

        proxy_pass            http://epay_backend;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID $req_id;
        proxy_set_header      X-Forwarded-Host $host;
        proxy_redirect        off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        access_log /var/log/nginx/auth.log security_log;
        error_page 502 503 504 = @service_unavailable;
    }

    # ----------------------------------------------------------
    # USER  →  /api/v1/user/...  →  /user/...
