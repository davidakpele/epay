        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID $req_id;
        proxy_redirect        off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        access_log /var/log/nginx/admin.log security_log;
        error_page 502 503 504 = @service_unavailable;
    }

    # ----------------------------------------------------------
    # USER TICKETS  →  /api/v1/tickets/...  →  /tickets/...
    # Role: USER — user-facing support ticket portal
    # ----------------------------------------------------------
    location /api/v1/tickets/ {
        if ($is_malicious) {
            access_log /var/log/nginx/security_blocked.log security_log;
            add_header Content-Type application/json always;
            return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED","request_id":"$req_id"}';
        }

        limit_req zone=user_api_limit burst=10 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET,POST,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            return 204;
        }

        if ($request_method !~ ^(GET|POST|OPTIONS)$) {
            return 405 '{"error":"Method not allowed","code":"METHOD_NOT_ALLOWED","request_id":"$req_id"}';
        }

        client_max_body_size 50k;

        rewrite ^/api/v1/(.*)$ /$1 break;

        proxy_pass            http://epay_backend;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID $req_id;
        proxy_redirect        off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        access_log /var/log/nginx/user.log security_log;
        error_page 502 503 504 = @service_unavailable;
    }

    # ----------------------------------------------------------
    # DEVELOPER PORTAL  →  /api/v1/developer/...  →  /developer/...
    # Role: USER — self-service API key & webhook management
    # ----------------------------------------------------------
    location /api/v1/developer/ {
        if ($is_malicious) {
            access_log /var/log/nginx/security_blocked.log security_log;
            add_header Content-Type application/json always;
            return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED","request_id":"$req_id"}';
        }

        limit_req zone=api_limit burst=15 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            return 204;
        }

        if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$) {
            return 405 '{"error":"Method not allowed","code":"METHOD_NOT_ALLOWED","request_id":"$req_id"}';
        }

        client_max_body_size 50k;

        rewrite ^/api/v1/(.*)$ /$1 break;

        proxy_pass            http://epay_backend;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID $req_id;
        proxy_redirect        off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        access_log /var/log/nginx/user.log security_log;
        error_page 502 503 504 = @service_unavailable;
    }

    # ----------------------------------------------------------
    # ADMIN VIRTUAL-CARD FEES  →  /api/v1/admin/virtual-cards/fees/...
    # Must be declared before /api/v1/admin/virtual-cards (longer prefix wins)
    # Roles: ADMIN, SUPER_USER — read + update fees, enable/disable
    # ----------------------------------------------------------
    location /api/v1/admin/virtual-cards/fees {
        if ($is_malicious) {
            access_log /var/log/nginx/security_blocked.log security_log;
            add_header Content-Type application/json always;
            return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED","request_id":"$req_id"}';
        }

        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET,PUT,PATCH,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            return 204;
        }

        if ($request_method !~ ^(GET|PUT|PATCH|OPTIONS)$) {
            return 405 '{"error":"Method not allowed","code":"METHOD_NOT_ALLOWED","request_id":"$req_id"}';
        }

        client_max_body_size 10k;

        rewrite ^/api/v1/(.*)$ /$1 break;

        proxy_pass            http://epay_backend;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID $req_id;
        proxy_redirect        off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        access_log /var/log/nginx/admin.log security_log;
        error_page 502 503 504 = @service_unavailable;
    }

    # ----------------------------------------------------------
    # ADMIN VIRTUAL CARDS  →  /api/v1/admin/virtual-cards/...
    # Roles: ADMIN, SUPER_USER — full card admin management
    # ----------------------------------------------------------
    location /api/v1/admin/virtual-cards {
        if ($is_malicious) {
            access_log /var/log/nginx/security_blocked.log security_log;
            add_header Content-Type application/json always;
            return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED","request_id":"$req_id"}';
        }

        limit_req zone=api_limit burst=15 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,PATCH,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            return 204;
        }

        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS)$) {
            return 405 '{"error":"Method not allowed","code":"METHOD_NOT_ALLOWED","request_id":"$req_id"}';
        }

        client_max_body_size 10k;

        rewrite ^/api/v1/(.*)$ /$1 break;

        proxy_pass            http://epay_backend;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID $req_id;
        proxy_redirect        off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        access_log /var/log/nginx/admin.log security_log;
        error_page 502 503 504 = @service_unavailable;
    }

    # ----------------------------------------------------------
    # UPLOADS (images)
    # /api/v1/uploads/images/2.jpg  →  backend /uploads/images/2.jpg
    # ----------------------------------------------------------
    location /api/v1/uploads/images/ {
        rewrite ^/api/v1/uploads/images/(.*)$ /uploads/images/$1 break;
        proxy_pass         http://epay_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=86400";
        proxy_cache_valid  200 1d;
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
        access_log off;
        error_page 502 503 504 = @service_unavailable;
    }

    # ----------------------------------------------------------
    # WebSocket  →  /api/v1/ws/...  →  /ws/...
    # ----------------------------------------------------------
    location /api/v1/ws/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass         http://epay_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Request-ID $req_id;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----------------------------------------------------------
    # CSP violation report
    # ----------------------------------------------------------
    location /api/csp-report {
        limit_req zone=api_limit burst=30 nodelay;
        if ($request_method != POST) { return 405; }
        access_log /var/log/nginx/csp-violations.log security_log;
        return 204;
    }

    # ----------------------------------------------------------
    # Nginx status (internal only)
    # ----------------------------------------------------------
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
    }

    # ----------------------------------------------------------
    # Security blocks & error pages
    # ----------------------------------------------------------
    include /etc/nginx/conf.d/12-security-blocks.conf;
    include /etc/nginx/conf.d/11-error-pages.conf;

    # ----------------------------------------------------------
    # Next.js static assets — long-lived cache
    # Covers /_next/static/... and public folder assets
    # ----------------------------------------------------------
    location /_next/static/ {
        proxy_pass         http://epay_frontend/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        access_log         off;
    }

    location /_next/ {
        proxy_pass         http://epay_frontend/_next/;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=3600";
        access_log         off;
    }

    # ----------------------------------------------------------
    # Frontend catch-all — proxy everything else to Next.js
    # This must come last so all /api/v1/ locations above take priority
    # ----------------------------------------------------------
    location / {
        proxy_pass            http://epay_frontend;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection $http_connection;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID $req_id;
        proxy_redirect        off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
        error_page 502 503 504 = @frontend_unavailable;
    }

    location @frontend_unavailable {
        default_type application/json;
        return 503 '{"error":"Frontend temporarily unavailable","code":"FRONTEND_DOWN","request_id":"$req_id"}';
    }
}
