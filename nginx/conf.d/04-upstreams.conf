# Upstream Configuration for Load Balancing

# Backend API Servers
upstream epay_backend {
    least_conn; 

    # Primary backend instances
    server epay-server-1:8029 max_fails=3 fail_timeout=30s weight=1;
    server epay-server-2:8029 max_fails=3 fail_timeout=30s weight=1;
    server epay-server-3:8029 max_fails=3 fail_timeout=30s weight=1;

    # Optional: Add more instances as needed
    # server epay-server-4:8029 max_fails=3 fail_timeout=30s weight=1;

    # Connection pooling
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Frontend Servers
upstream epay_frontend {
    least_conn;
    server frontend-1:3000 max_fails=3 fail_timeout=30s weight=1;
    server frontend-2:3000 max_fails=3 fail_timeout=30s weight=1;
    server frontend-3:3000 max_fails=3 fail_timeout=30s weight=1;

    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# WebSocket Servers (sticky sessions via ip_hash)
upstream epay_websocket {
    ip_hash;  # Sticky sessions based on client IP
    server epay-server-1:8029;
    server epay-server-2:8029;
    server epay-server-3:8029;
    keepalive 32;
}

# Admin Panel
upstream epay_admin {
    least_conn;
    server epay-server-1:8029 weight=2;
    server epay-server-2:8029 weight=1;
    server epay-server-3:8029 weight=1;
}