# =============================================================
# Nginx stub_status — internal metrics server
# Included at http{} level in nginx.conf (NOT inside a server block).
#
# Listens on port 8080 — internal Docker network only.
# This avoids the port-80 default_server 301 redirect that
# caused the nginx-prometheus-exporter to receive an
# "unsolicited response" and then fail on 443 (no TLS).
#
# nginx-exporter scrape URI in docker-compose.yml:
#   --nginx.scrape-uri=http://nginx:8080/nginx_status
#
# Why the header block below exists:
#   01-security-headers.conf uses add_header at http{} level, which
#   nginx inherits into every server block. The nginx-prometheus-exporter
#   expects a plain-text stub_status body with NO extra headers — any
#   inherited security header (CSP, Permissions-Policy, Cache-Control…)
#   gets prepended to the response and breaks the exporter's parser.
#
#   nginx's add_header inheritance rule: the FIRST add_header directive
#   inside a server{} or location{} block completely replaces ALL
#   inherited add_header directives from outer scopes. So placing a
#   single dummy add_header here (Content-Type) cancels every header
#   that 01-security-headers.conf would otherwise inject.
# =============================================================
server {
    listen 8080;
    server_name _;

    # Cancel all inherited security headers from http{} scope.
    # This single directive replaces the entire inherited add_header set.
    add_header Content-Type text/plain;

    # Only /nginx_status is served — everything else 404s
    location = /nginx_status {
        stub_status on;
        access_log  off;

        # Reset again at location level to be explicit
        add_header Content-Type text/plain;

        # Allow only internal Docker network ranges
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }

    location / {
        # Also cancel headers here so the 404 body isn't polluted
        add_header Content-Type text/plain;
        return 404;
    }
}
