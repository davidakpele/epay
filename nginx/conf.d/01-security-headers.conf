# =============================================================
# Global Security Headers
# Author: DAVID AK
#
# These headers are applied to every response by default.
# Individual location blocks can override specific headers
# (e.g. uploads override Cache-Control and CORP for images).
# =============================================================

# ── Clickjacking ──────────────────────────────────────────────
add_header X-Frame-Options "DENY" always;

# ── MIME sniffing ─────────────────────────────────────────────
add_header X-Content-Type-Options "nosniff" always;

# ── Legacy XSS filter (belt-and-suspenders) ───────────────────
add_header X-XSS-Protection "1; mode=block" always;

# ── Referrer leakage ──────────────────────────────────────────
add_header Referrer-Policy "no-referrer" always;

# ── HSTS (2 years, include subdomains) ────────────────────────
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# ── Content Security Policy ───────────────────────────────────
add_header Content-Security-Policy "
    default-src 'none';
    script-src 'self';
    style-src 'self' https:;
    img-src 'self' data: https:;
    font-src 'self' https: data:;
    connect-src 'self' https: wss:;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'self';
    object-src 'none';
    report-uri /api/csp-report;
" always;

add_header Content-Security-Policy-Report-Only "
    default-src 'none';
    script-src 'self';
    style-src 'self' https:;
    img-src 'self' data: https:;
    font-src 'self' https: data:;
    connect-src 'self' https: wss:;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'self';
    object-src 'none';
    report-uri /api/csp-report;
" always;

# ── Permissions Policy ────────────────────────────────────────
add_header Permissions-Policy "
    accelerometer=(),
    ambient-light-sensor=(),
    autoplay=(),
    battery=(),
    camera=(),
    display-capture=(),
    document-domain=(),
    encrypted-media=(),
    fullscreen=(),
    gamepad=(),
    geolocation=(),
    gyroscope=(),
    magnetometer=(),
    microphone=(),
    midi=(),
    payment=(),
    usb=(),
    picture-in-picture=(),
    sync-xhr=(),
    vr=(),
    xr-spatial-tracking=()
" always;

# ── Cross-Origin policies ─────────────────────────────────────
# COEP: require-corp ensures subresources must opt-in to being embedded.
# NOTE: image locations override CORP to "cross-origin" so <img> tags work.
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# ── Default cache policy for API responses ────────────────────
# Sensitive API responses must not be cached by browsers or proxies.
# Static asset locations (uploads, /_next/static/) override this
# with "public, max-age=..." to allow caching where safe.
add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
add_header Pragma "no-cache" always;
add_header Expires "0" always;

# ── API metadata ──────────────────────────────────────────────
add_header X-Banking-API-Version "2.0" always;

# ── Hide server internals ─────────────────────────────────────
proxy_hide_header X-Runtime;
proxy_hide_header X-Powered-By;
