# =============================================================
# Content Cache Configuration
# Caches: user profile/data  →  user_data_cache  (TTL 2 min)
#         wallet balances     →  wallet_cache     (TTL 30 sec)
#
# Design rules
#  - Only GET responses are stored; writes always reach the backend.
#  - Requests that carry an Authorization header bypass the cache
#    for mutations (POST / PUT / PATCH / DELETE).
#  - Cache is keyed on scheme + method + host + URI + Authorization
#    so each user sees their own cached copy.
#  - A stale entry is served for up to 5 s while the backend is
#    being re-fetched (stale-while-revalidate) and for up to 10 s
#    during upstream errors (stale-if-error).
#  - The X-Cache-Status response header reports HIT / MISS / BYPASS
#    for easy observability.
# =============================================================

# ------------------------------------------------------------------
# Cache storage paths (separate dirs keep eviction policies isolated)
# ------------------------------------------------------------------
proxy_cache_path /var/cache/nginx/user_data
    levels=1:2
    keys_zone=user_data_cache:8m
    inactive=5m
    max_size=256m
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/wallet
    levels=1:2
    keys_zone=wallet_cache:4m
    inactive=2m
    max_size=128m
    use_temp_path=off;

# ------------------------------------------------------------------
# Cache-key: scheme + method + host + URI + per-user Authorization
# (overrides the global key so mutations don't pollute GET caches)
# ------------------------------------------------------------------
# Bypass / no-store decision map
#   $http_authorization is non-empty on all authenticated calls.
#   We only cache GET; everything else must reach the backend.
map $request_method $skip_cache_by_method {
    default 1;   # POST / PUT / PATCH / DELETE → always bypass
    GET     0;   # GET → evaluate further
}

# Combine method bypass with an explicit Cache-Control: no-cache hint
# from the client (e.g. browser hard-refresh).
map "$skip_cache_by_method:$http_cache_control" $no_cache {
    default          0;
    "0:no-cache"     1;
    "0:no-store"     1;
    ~^1              1;   # any non-GET
}
