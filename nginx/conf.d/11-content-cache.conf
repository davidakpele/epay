# =============================================================
# HTTP Cache Configuration
# Author: DAVID AK
#
# Cache zones (all paths live under /var/cache/nginx/):
#
#  Zone               Path              TTL (200)  Size   Purpose
#  ─────────────────  ────────────────  ─────────  ─────  ─────────────────────────────
#  static_assets      static            1 year     2 GB   Immutable JS/CSS bundles
#  frontend_pages     frontend          1 hour     512 MB Next.js page HTML (microcache)
#  user_data_cache    user_data         2 min      256 MB User profile & account data
#  wallet_cache       wallet            30 sec     128 MB Wallet balances (financial)
#  history_cache      history           1 min      512 MB Transaction history (paginated)
#  beneficiary_cache  beneficiary       5 min      128 MB Beneficiary list (slow-change)
#  support_cache      support           10 min     128 MB Support FAQs / articles
#  bank_cache         bank              5 min      128 MB Linked bank accounts
#  settings_cache     settings          5 min      128 MB User settings
#  microcache         microcache        1 sec      256 MB Generic burst-absorber
#
# Design rules
#  - Only GET/HEAD responses are stored; all writes always reach the backend.
#  - Requests carrying Cache-Control: no-cache or no-store bypass the cache.
#  - Each zone uses a per-user key (includes $http_authorization) so users
#    never see each other's cached data.
#  - Stale content is served for up to 5 s during revalidation and up to
#    15 s during upstream errors, preventing thundering-herd on failures.
#  - proxy_cache_lock collapses concurrent cache-miss requests into one
#    upstream call (coalescing), reducing backend spike load.
#  - X-Cache-Status header on every response for observability.
#  - Microcaching (1 s TTL) absorbs burst traffic on unauthenticated/
#    semi-public endpoints without meaningful staleness risk.
# =============================================================


# =============================================================
# Cache storage paths
# Declared here so they exist before any server block references them.
# (nginx.conf must NOT re-declare these same zone names.)
# =============================================================

# Immutable front-end bundles (/_next/static/)
proxy_cache_path /var/cache/nginx/static
    levels=1:2
    keys_zone=static_assets:10m
    inactive=365d
    max_size=2g
    use_temp_path=off;

# Next.js page HTML — microcache (1 s)
proxy_cache_path /var/cache/nginx/frontend
    levels=1:2
    keys_zone=frontend_pages:10m
    inactive=10m
    max_size=512m
    use_temp_path=off;

# User profile / account data (2 min)
proxy_cache_path /var/cache/nginx/user_data
    levels=1:2
    keys_zone=user_data_cache:8m
    inactive=5m
    max_size=256m
    use_temp_path=off;

# Wallet balances (30 s — financial data ages fast)
proxy_cache_path /var/cache/nginx/wallet
    levels=1:2
    keys_zone=wallet_cache:4m
    inactive=2m
    max_size=128m
    use_temp_path=off;

# Transaction history — paginated reads (1 min)
proxy_cache_path /var/cache/nginx/history
    levels=1:2
    keys_zone=history_cache:8m
    inactive=5m
    max_size=512m
    use_temp_path=off;

# Beneficiary list — changes infrequently (5 min)
proxy_cache_path /var/cache/nginx/beneficiary
    levels=1:2
    keys_zone=beneficiary_cache:4m
    inactive=15m
    max_size=128m
    use_temp_path=off;

# Support FAQs / articles — near-static content (10 min)
proxy_cache_path /var/cache/nginx/support
    levels=1:2
    keys_zone=support_cache:4m
    inactive=30m
    max_size=128m
    use_temp_path=off;

# Linked bank accounts (5 min)
proxy_cache_path /var/cache/nginx/bank
    levels=1:2
    keys_zone=bank_cache:4m
    inactive=15m
    max_size=128m
    use_temp_path=off;

# User settings (5 min)
proxy_cache_path /var/cache/nginx/settings
    levels=1:2
    keys_zone=settings_cache:4m
    inactive=15m
    max_size=128m
    use_temp_path=off;

# Microcache — 1-second TTL generic burst absorber
proxy_cache_path /var/cache/nginx/microcache
    levels=1:2
    keys_zone=microcache:8m
    inactive=30s
    max_size=256m
    use_temp_path=off;

# Shared temp path for all zones
proxy_temp_path /var/cache/nginx/tmp;


# =============================================================
# Cache-key template
# Per-user: scheme + method + host + URI + Authorization token.
# This ensures that every user's response is stored separately,
# preventing information leakage across accounts.
# =============================================================
proxy_cache_key "$scheme$request_method$host$request_uri$http_authorization";


# =============================================================
# Bypass / no-store decision maps
# =============================================================

# 1. Method gate — only cache GET and HEAD
map $request_method $skip_cache_by_method {
    default   1;   # POST / PUT / PATCH / DELETE → always bypass
    GET       0;
    HEAD      0;
}

# 2. Client-driven bypass — honour Cache-Control: no-cache / no-store
#    (e.g. browser hard-refresh, explicit revalidation requests)
map $http_cache_control $skip_by_cache_control {
    default   0;
    "no-cache" 1;
    "no-store" 1;
    ~no-cache  1;
    ~no-store  1;
}

# 3. Combined bypass variable used by every cacheable location:
#      $no_cache == 1  →  proxy_cache_bypass + proxy_no_cache
#      $no_cache == 0  →  allow caching
map "$skip_cache_by_method:$skip_by_cache_control" $no_cache {
    default   0;
    "0:1"     1;   # GET but client said no-cache/no-store
    ~^1       1;   # any non-GET/HEAD method
}

# 4. Microcache bypass — same as $no_cache but also bypasses when the
#    request carries an Authorization header so authenticated requests
#    never hit the 1-second shared (unauthenticated) microcache.
map "$no_cache:$http_authorization" $no_microcache {
    default   0;
    "0:"      0;   # no bypass, no auth → allow microcache
    ~^1       1;   # $no_cache already set
    ~^0:.+    1;   # authenticated request → skip microcache
}

# 5. Static-asset bypass — purely method + cache-control; no auth check
#    because static files are public and we want maximum cache efficiency.
map "$skip_cache_by_method:$skip_by_cache_control" $no_static_cache {
    default   0;
    "0:1"     1;
    ~^1       1;
}
