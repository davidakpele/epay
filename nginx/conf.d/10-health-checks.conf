# =============================================================
# Health Check & Metrics Endpoints
# Included inside the server block in 06-server-https.conf
# =============================================================

# ----------------------------------------------------------
# Nginx self-health — used by docker-compose healthcheck
# and the upstream load-balancer / external monitors.
# Returns 200 immediately without touching the backend.
# ----------------------------------------------------------
location = /nginx-health {
    access_log off;
    return 200 '{"status":"healthy","service":"nginx"}';
    add_header Content-Type application/json always;
}

# ----------------------------------------------------------
# Backend health proxy — forwards to Spring Boot Actuator.
# NOTE: 06-server-https.conf already has "location = /health"
# for a static nginx-only response.  This block uses a
# distinct path so both can coexist without conflict.
# ----------------------------------------------------------
location = /backend-health {
    access_log off;

    # Only reachable from internal networks and monitoring stack
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    proxy_pass             http://epay_backend/actuator/health;
    proxy_http_version     1.1;
    proxy_set_header       Connection "";
    proxy_set_header       Host $host;
    proxy_connect_timeout  5s;
    proxy_read_timeout     5s;

    error_page 502 503 504 = @health_failed;
}

location @health_failed {
    default_type application/json;
    return 503 '{"status":"DOWN","message":"Service temporarily unavailable"}';
}

# ----------------------------------------------------------
# Prometheus scrape endpoint — INTERNAL ONLY.
# Proxies to /actuator/prometheus on the backend.
# Accessible only from the Prometheus container's subnet.
# ----------------------------------------------------------
location = /metrics {
    access_log off;

    # Allow Prometheus container and internal monitoring network only
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    proxy_pass            http://epay_backend/actuator/prometheus;
    proxy_http_version    1.1;
    proxy_set_header      Connection "";
    proxy_set_header      Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout    10s;
}
