# =============================================================
# Swagger / OpenAPI — accessible without /api/v1 prefix
#
# springdoc config:
#   swagger-ui.path = /docs        → UI at /docs
#   api-docs.path   = /v3/api-docs → spec at /v3/api-docs
# =============================================================

# ── Swagger UI main page (/docs and /docs/) ────────────────────────────────
location = /docs {
    proxy_pass         http://epay_backend/docs;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
    access_log off;
}

# ── Swagger UI sub-resources (/docs/*, /docs/**) ───────────────────────────
location /docs/ {
    proxy_pass         http://epay_backend/docs/;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
    access_log off;
}

# ── Swagger UI static assets (/swagger-ui/**) ─────────────────────────────
location /swagger-ui/ {
    proxy_pass         http://epay_backend/swagger-ui/;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
    add_header         Cache-Control "public, max-age=3600";
    access_log off;
}

# ── OpenAPI JSON spec and all sub-paths ───────────────────────────────────
# Covers:
#   /v3/api-docs                    → full spec JSON
#   /v3/api-docs/swagger-config     → UI config
#   /v3/api-docs.yaml               → YAML spec
location /v3/api-docs {
    proxy_pass         http://epay_backend/v3/api-docs;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
    access_log off;
}

# ── swagger-ui.html redirect (some clients request this directly) ──────────
location = /swagger-ui.html {
    proxy_pass         http://epay_backend/swagger-ui.html;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect     off;
    access_log off;
}
