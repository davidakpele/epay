# ============================================================
# Administrative Security — kept for reference / optional use
#
# This file is NOT included by 06-server-https.conf by default.
# Uncomment the include line in that file if you want these
# extra admin-panel blocks active.
# ============================================================

# -------------------------------------------------------
# Admin panel static assets (if serving an admin SPA)
# -------------------------------------------------------
location ~ ^/(css|js|fonts|images|img|dist|build|plugins)/ {
    if ($is_malicious) {
        access_log /var/log/nginx/security_blocked.log security_log;
        add_header Content-Type application/json always;
        return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED"}';
    }

    proxy_pass         http://epay_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache        static_cache;
    proxy_cache_valid  200 7d;
    add_header         Cache-Control "public, max-age=604800, immutable";
    access_log off;
}

# -------------------------------------------------------
# Admin API routes  →  epay-server:8080/admin/
# (already covered by /v1/admin/ in 10-location-other-services.conf
#  but explicit /admin/* mapping kept here for direct-path access)
# -------------------------------------------------------
location ~ ^/admin/(.*)$ {
    if ($is_malicious) {
        access_log /var/log/nginx/security_blocked.log security_log;
        add_header Content-Type application/json always;
        return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED"}';
    }

    if ($request_uri ~* "(\.\./|\.\.[\\\\]|/etc/|/proc/|\.git|\.env|passwd|shadow)") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"Path traversal attempt detected","code":"PATH_TRAVERSAL_BLOCKED","request_id":"$req_id"}';
    }

    if ($request_uri ~* "(union.*select|insert.*into|delete.*from|drop.*table|waitfor.*delay|sleep\s*[(])") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"SQL injection attempt detected","code":"SQLI_BLOCKED","request_id":"$req_id"}';
    }

    if ($request_uri ~* "(<script|javascript:|onerror=|onload=|eval\s*[(]|alert\s*[(])") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"XSS attempt detected","code":"XSS_BLOCKED","request_id":"$req_id"}';
    }

    limit_req zone=api_limit burst=20 nodelay;
    limit_req zone=per_user burst=10 nodelay;
    limit_req_status 429;

    if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS)$) {
        return 405 '{"error":"Method not allowed","code":"METHOD_NOT_ALLOWED","request_id":"$req_id"}';
    }

    # CORS headers for admin frontend
    add_header Access-Control-Allow-Origin  "$http_origin" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true" always;

    if ($request_method = OPTIONS) {
        add_header Content-Type text/plain;
        add_header Content-Length 0;
        return 204;
    }

    client_max_body_size 1M;
    client_body_buffer_size 1M;

    proxy_pass         http://epay_backend/admin/$1;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID $req_id;
    proxy_redirect     off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    access_log /var/log/nginx/admin.log security_log;
    error_page 502 503 504 = @service_unavailable;
}
