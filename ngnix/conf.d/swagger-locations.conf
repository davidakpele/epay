# Swagger / OpenAPI — accessible without /api/v1 prefix
#
# springdoc config:
#   swagger-ui.path = /docs       → UI served at /docs
#   api-docs.path   = /v3/api-docs → spec served at /v3/api-docs

# Swagger UI  →  backend /docs
location /docs {
    proxy_pass         http://epay_backend/docs;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
    access_log off;
}

# Swagger UI static assets (springdoc still serves these under /swagger-ui/)
location /swagger-ui/ {
    proxy_pass         http://epay_backend/swagger-ui/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
    access_log off;
}

# OpenAPI spec — covers /v3/api-docs, /v3/api-docs/swagger-config, /v3/api-docs.yaml
location /v3/api-docs {
    proxy_pass         http://epay_backend/v3/api-docs;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
    access_log off;
}
