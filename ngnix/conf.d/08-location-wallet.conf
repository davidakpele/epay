# ============================================================
# Wallet Locations  →  epay-server:8080
# ============================================================

# -------------------------------------------------------
# Reusable security check snippet (inlined per location)
# Nginx doesn't support macros, so checks are per-block.
# -------------------------------------------------------

location /v1/wallet/ {
    if ($is_malicious) {
        access_log /var/log/nginx/security_blocked.log security_log;
        add_header Content-Type application/json always;
        return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED"}';
    }

    if ($request_uri ~* "(\.\./|\.\.[\\\\]|/etc/|/proc/|/sys/|\.git|\.env|passwd|shadow)") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"Path traversal attempt detected","code":"PATH_TRAVERSAL_BLOCKED","request_id":"$req_id"}';
    }

    if ($request_uri ~* "(union.*select|insert.*into|delete.*from|drop.*table|waitfor.*delay|sleep\s*[(])") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"SQL injection attempt detected","code":"SQLI_BLOCKED","request_id":"$req_id"}';
    }

    if ($request_uri ~* "(<script|javascript:|onerror=|onload=|eval\s*[(]|alert\s*[(])") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"XSS attempt detected","code":"XSS_BLOCKED","request_id":"$req_id"}';
    }

    if ($request_uri ~* "(%00|0x00|[$][{])") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"Malicious characters detected","code":"CHARACTER_BLOCKED","request_id":"$req_id"}';
    }

    # Tight rate limiting for financial endpoints
    limit_req zone=api_limit burst=20 nodelay;
    limit_req zone=per_user burst=10 nodelay;
    limit_req_status 429;

    if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH)$) {
        return 405 '{"error":"Method not allowed","code":"METHOD_NOT_ALLOWED","request_id":"$req_id"}';
    }

    client_max_body_size 10k;
    client_body_buffer_size 10k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    proxy_pass         http://epay_backend/wallet/;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID $req_id;
    proxy_set_header   X-Forwarded-Host $host;
    proxy_set_header   X-Original-URI $request_uri;
    proxy_redirect     off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    15s;
    proxy_read_timeout    15s;
    proxy_buffer_size     4k;
    proxy_buffers         8 4k;
    proxy_busy_buffers_size 8k;

    access_log /var/log/nginx/wallet.log security_log;
    error_page 403 = @user_blocked;
    error_page 502 503 504 = @service_unavailable;
}

# -------------------------------------------------------
# Admin wallet management
# -------------------------------------------------------
location /v1/admin/wallet/ {
    if ($is_malicious) {
        access_log /var/log/nginx/security_blocked.log security_log;
        add_header Content-Type application/json always;
        return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED"}';
    }

    # Admin endpoints — very tight rate limit
    limit_req zone=api_limit burst=10 nodelay;
    limit_req_status 429;

    if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH)$) {
        return 405 '{"error":"Method not allowed","code":"METHOD_NOT_ALLOWED","request_id":"$req_id"}';
    }

    client_max_body_size 10k;

    proxy_pass         http://epay_backend/admin/wallet/;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID $req_id;
    proxy_redirect     off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    15s;
    proxy_read_timeout    15s;

    access_log /var/log/nginx/wallet.log security_log;
    error_page 502 503 504 = @service_unavailable;
}

# -------------------------------------------------------
# WebSocket (future real-time balance/notifications)
# -------------------------------------------------------
location /v1/ws/ {
    proxy_pass         http://epay_backend/ws/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Request-ID $req_id;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
