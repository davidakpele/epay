# ============================================================
# Transaction Locations (Deposit, Withdrawal, History)
# All proxy to single  →  epay-server:8080
# ============================================================

# -------------------------------------------------------
# Deposit
# -------------------------------------------------------
location /v1/deposit/ {
    if ($is_malicious) {
        access_log /var/log/nginx/security_blocked.log security_log;
        add_header Content-Type application/json always;
        return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED"}';
    }

    if ($request_uri ~* "(\.\./|\.\.[\\\\]|/etc/|/proc/|\.git|\.env|passwd|shadow)") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"Path traversal attempt detected","code":"PATH_TRAVERSAL_BLOCKED","request_id":"$req_id"}';
    }

    if ($request_uri ~* "(union.*select|insert.*into|delete.*from|drop.*table|waitfor.*delay|sleep\s*[(])") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"SQL injection attempt detected","code":"SQLI_BLOCKED","request_id":"$req_id"}';
    }

    if ($request_uri ~* "(<script|javascript:|onerror=|onload=|eval\s*[(]|alert\s*[(])") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"XSS attempt detected","code":"XSS_BLOCKED","request_id":"$req_id"}';
    }

    # Strict rate limiting for financial transactions
    limit_req zone=strict_limit burst=10 nodelay;
    limit_req zone=per_user  burst=5  nodelay;
    limit_req_status 429;

    if ($request_method !~ ^(GET|POST|OPTIONS)$) {
        return 405 '{"error":"Method not allowed","code":"METHOD_NOT_ALLOWED","request_id":"$req_id"}';
    }

    client_max_body_size 10k;
    client_body_buffer_size 10k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    proxy_pass         http://epay_backend/deposit/;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID $req_id;
    proxy_redirect     off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    15s;
    proxy_read_timeout    15s;

    access_log /var/log/nginx/transactions.log security_log;
    error_page 502 503 504 = @service_unavailable;
}

# -------------------------------------------------------
# Paystack & Flutterwave webhooks — no auth, no rate cap
# (already authenticated by HMAC-SHA512 in the app)
# -------------------------------------------------------
location /webhook/deposit/ {
    # Only allow POST
    if ($request_method != POST) {
        return 405;
    }

    # Accept from anywhere — webhook IPs vary per provider
    client_max_body_size 50k;

    proxy_pass         http://epay_backend/webhook/deposit/;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID $req_id;
    proxy_redirect     off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    access_log /var/log/nginx/webhooks.log security_log;
    error_page 502 503 504 = @service_unavailable;
}

