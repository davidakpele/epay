# ============================================================
# Other Service Locations  →  epay-server:8080
# Covers: blacklist, bank lookup, Swagger docs, admin,
#         Zipkin (internal only), catch-all API
# ============================================================

# -------------------------------------------------------
# Admin — user & wallet management
# -------------------------------------------------------
location /v1/admin/ {
    if ($is_malicious) {
        access_log /var/log/nginx/security_blocked.log security_log;
        add_header Content-Type application/json always;
        return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED"}';
    }

    if ($request_uri ~* "(\.\./|\.\.[\\\\]|/etc/|/proc/|\.git|\.env|passwd|shadow)") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"Path traversal attempt detected","code":"PATH_TRAVERSAL_BLOCKED","request_id":"$req_id"}';
    }

    if ($request_uri ~* "(union.*select|insert.*into|delete.*from|drop.*table|waitfor.*delay|sleep\s*[(])") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"SQL injection attempt detected","code":"SQLI_BLOCKED","request_id":"$req_id"}';
    }

    limit_req zone=api_limit burst=10 nodelay;
    limit_req_status 429;

    if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS)$) {
        return 405 '{"error":"Method not allowed","code":"METHOD_NOT_ALLOWED","request_id":"$req_id"}';
    }

    client_max_body_size 1M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    proxy_pass         http://epay_backend/admin/;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID $req_id;
    proxy_redirect     off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    access_log /var/log/nginx/admin.log security_log;
    error_page 502 503 504 = @service_unavailable;
}

