# -------------------------------------------------------
# Catch-all API — forward anything under /v1/ or /api/
# that wasn't matched by a more specific location block
# -------------------------------------------------------
location /v1/ {
    if ($is_malicious) {
        access_log /var/log/nginx/security_blocked.log security_log;
        add_header Content-Type application/json always;
        return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED"}';
    }

    if ($request_uri ~* "(\.\./|\.\.[\\\\]|/etc/|/proc/|\.git|\.env|passwd|shadow)") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"Path traversal attempt detected","code":"PATH_TRAVERSAL_BLOCKED","request_id":"$req_id"}';
    }

    limit_req zone=api_limit burst=30 nodelay;
    limit_req_status 429;

    if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS)$) {
        return 405 '{"error":"Method not allowed","code":"METHOD_NOT_ALLOWED","request_id":"$req_id"}';
    }

    client_max_body_size 10M;

    # Strip /v1 prefix — app controllers use bare paths (e.g. /auth, /wallet)
    rewrite ^/v1/(.*)$ /$1 break;

    proxy_pass         http://epay_backend;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID $req_id;
    proxy_redirect     off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    access_log /var/log/nginx/access.log json_combined;
    error_page 502 503 504 = @service_unavailable;
}

# -------------------------------------------------------
# Default catch-all — return 404 for unknown paths
# -------------------------------------------------------
location / {
    if ($maintenance_mode = 1) {
        add_header Content-Type application/json always;
        return 503 '{"error":"System under maintenance. Please try again later.","code":"MAINTENANCE"}';
    }

    if ($bad_bot = 1) {
        add_header Content-Type application/json always;
        return 403 '{"error":"Access denied","code":"BOT_DETECTED"}';
    }

    limit_req zone=global_limit burst=200 nodelay;
    limit_req_status 429;

    # Security checks
    if ($request_uri ~* "(\.\./|\.\.[\\\\]|/etc/|/proc/|\.git|\.env|passwd|shadow)") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"Path traversal attempt detected","code":"PATH_TRAVERSAL_BLOCKED","request_id":"$req_id"}';
    }

    # Forward all unmatched requests directly to the backend
    # Covers /auth/, /user/, /wallet/, /deposit/, /withdrawal/, /history/, /kyc/, etc.
    proxy_pass         http://epay_backend;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID $req_id;
    proxy_redirect     off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    access_log /var/log/nginx/access.log json_combined;
    error_page 502 503 504 = @service_unavailable;
}
