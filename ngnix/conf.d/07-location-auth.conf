# -------------------------------------------------------
# KYC
# -------------------------------------------------------
location /v1/kyc/ {
    if ($is_malicious) {
        access_log /var/log/nginx/security_blocked.log security_log;
        add_header Content-Type application/json always;
        return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED"}';
    }

    limit_req zone=api_limit burst=10 nodelay;
    limit_req_status 429;

    client_max_body_size 15M;
    client_body_buffer_size 1M;

    proxy_pass         http://epay_backend/kyc/;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID $req_id;
    proxy_redirect     off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    access_log /var/log/nginx/kyc.log security_log;
}

# -------------------------------------------------------
# Uploaded images (static-ish — can be served by app)
# -------------------------------------------------------
location /v1/uploads/images/ {
    proxy_pass         http://epay_backend/uploads/images/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_cache        static_cache;
    proxy_cache_valid  200 1d;
    add_header         Cache-Control "public, max-age=86400";
    access_log off;
}

# -------------------------------------------------------
# Account statements
# -------------------------------------------------------
location /v1/statement/ {
    if ($is_malicious) {
        access_log /var/log/nginx/security_blocked.log security_log;
        add_header Content-Type application/json always;
        return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED"}';
    }

    limit_req zone=api_limit burst=10 nodelay;
    limit_req_status 429;

    proxy_pass         http://epay_backend/statement/;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID $req_id;
    proxy_redirect     off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    access_log /var/log/nginx/auth.log security_log;
}
