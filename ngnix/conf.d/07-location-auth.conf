# ============================================================
# Auth & User Locations  →  epay-server:8029
# ============================================================

# -------------------------------------------------------
# CSP violation reporting
# -------------------------------------------------------
location /api/csp-report {
    limit_req zone=api_limit burst=30 nodelay;

    if ($request_method != POST) {
        return 405;
    }

    access_log /var/log/nginx/csp-violations.log security_log;
    return 204;
}

# -------------------------------------------------------
# Health & Nginx status
# -------------------------------------------------------
location /v1/health {
    access_log off;
    return 200 '{"status":"healthy","timestamp":"$time_local","service":"nginx","request_id":"$req_id"}';
    add_header Content-Type application/json;
}

location /nginx_status {
    stub_status on;
    access_log off;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    deny all;
}

location /container-health {
    access_log off;
    return 200 '{"status":"healthy","services":{"nginx":"up"},"timestamp":"$time_local"}';
    add_header Content-Type application/json;
}

# -------------------------------------------------------
# Spring Boot Actuator health (proxied to app)
# -------------------------------------------------------
location /actuator/health {
    limit_req zone=api_limit burst=5 nodelay;

    proxy_pass         http://epay_backend/actuator/health;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID $req_id;
    access_log off;
}

# -------------------------------------------------------
# Auth endpoints
# -------------------------------------------------------
location /v1/auth/ {
    # Attack detection
    if ($is_malicious) {
        access_log /var/log/nginx/security_blocked.log security_log;
        add_header Content-Type application/json always;
        return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED"}';
    }

    if ($http_user_agent ~* (nikto|sqlmap|masscan|nessus|openvas)) {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"Unauthorized scanner detected","code":"SCANNER_BLOCKED"}';
    }

    if ($request_uri ~* (\.\.\/|\.\.\\|\/etc\/|\/proc\/|\/sys\/|\/var\/)) {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"Path traversal attempt detected","code":"PATH_TRAVERSAL_BLOCKED"}';
    }

    if ($request_uri ~* (<script|javascript:|onerror=|onload=|eval\(|alert\()) {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"XSS attempt detected","code":"XSS_BLOCKED"}';
    }

    if ($request_uri ~* "(\||;|`|<|>|\$\(|\$\{)") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"Command injection attempt detected","code":"CMD_INJECTION_BLOCKED"}';
    }

    # Rate limiting — tight for auth endpoints
    limit_req zone=api_limit burst=30 nodelay;
    limit_req zone=per_user burst=10 nodelay;
    limit_req_status 429;

    client_max_body_size 10k;
    client_body_buffer_size 10k;

    proxy_pass         http://epay_backend/auth/;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID $req_id;
    proxy_set_header   X-Forwarded-Host $host;
    proxy_set_header   X-Original-URI $request_uri;
    proxy_redirect     off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;
    proxy_buffer_size     4k;
    proxy_buffers         8 4k;
    proxy_busy_buffers_size 8k;

    access_log /var/log/nginx/auth.log security_log;

    error_page 502 503 504 = @service_unavailable;
}

# -------------------------------------------------------
# User profile / settings
# -------------------------------------------------------
location /v1/user/ {
    if ($is_malicious) {
        access_log /var/log/nginx/security_blocked.log security_log;
        add_header Content-Type application/json always;
        return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED"}';
    }

    if ($request_uri ~* "(\.\./|\.\.[\\\\]|/etc/|/proc/|/sys/|/var/|\.git|\.env|passwd|shadow)") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"Path traversal attempt detected","code":"PATH_TRAVERSAL_BLOCKED","request_id":"$req_id"}';
    }

    if ($request_uri ~* "(union.*select|insert.*into|delete.*from|drop.*table|waitfor.*delay|sleep\s*[(])") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"SQL injection attempt detected","code":"SQLI_BLOCKED","request_id":"$req_id"}';
    }

    if ($request_uri ~* "(<script|javascript:|onerror=|onload=|eval\s*[(]|alert\s*[(])") {
        access_log /var/log/nginx/security_blocked.log security_log;
        return 403 '{"error":"XSS attempt detected","code":"XSS_BLOCKED","request_id":"$req_id"}';
    }

    limit_req zone=user_api_limit burst=20 nodelay;
    limit_req_status 429;

    if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH)$) {
        return 405 '{"error":"Method not allowed","code":"METHOD_NOT_ALLOWED","request_id":"$req_id"}';
    }

    client_max_body_size 10M;
    client_body_buffer_size 128k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    proxy_pass         http://epay_backend/user/;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID $req_id;
    proxy_redirect     off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    access_log /var/log/nginx/user.log security_log;
    error_page 403 = @user_blocked;
}

