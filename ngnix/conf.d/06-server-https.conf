# Main HTTPS Server Block
# Listens on 443 (TLS) and 80 (plain, for local/dev without certs)

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # -------------------------------------------------------
    # Connection guard
    # -------------------------------------------------------
    limit_conn conn_limit 50;

    # -------------------------------------------------------
    # Request ID propagation
    # -------------------------------------------------------
    add_header X-Request-ID $req_id always;

    # -------------------------------------------------------
    # Location blocks
    # -------------------------------------------------------
    include /etc/nginx/conf.d/07-location-auth.conf;
    include /etc/nginx/conf.d/08-location-wallet.conf;
    include /etc/nginx/conf.d/09-location-transactions.conf;
    include /etc/nginx/conf.d/10-location-other-services.conf;
    include /etc/nginx/conf.d/11-error-pages.conf;
    include /etc/nginx/conf.d/12-security-blocks.conf;
    # deny.d rules are covered by 12-security-blocks.conf — not included to avoid duplicate location conflicts
}

