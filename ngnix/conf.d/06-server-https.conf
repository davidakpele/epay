    # ----------------------------------------------------------
    # ADMIN USERS  →  /api/v1/admin/users  →  /admin/users/...
    # (no trailing slash — covers both /admin/users and /admin/users/...)
    # ----------------------------------------------------------
    location /api/v1/admin/users {
        if ($is_malicious) {
            access_log /var/log/nginx/security_blocked.log security_log;
            add_header Content-Type application/json always;
            return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED","request_id":"$req_id"}';
        }

        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,PATCH,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            return 204;
        }

        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS)$) {
            return 405 '{"error":"Method not allowed","code":"METHOD_NOT_ALLOWED","request_id":"$req_id"}';
        }

        client_max_body_size 1M;

        rewrite ^/api/v1/(.*)$ /$1 break;

        proxy_pass            http://epay_backend;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID $req_id;
        proxy_redirect        off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        access_log /var/log/nginx/admin.log security_log;
        error_page 502 503 504 = @service_unavailable;
    }

    # ----------------------------------------------------------
    # UPLOADS (images)
    # ----------------------------------------------------------
    location /api/v1/uploads/images/ {
        proxy_pass         http://epay_backend/uploads/images/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ----------------------------------------------------------
    # WebSocket  →  /api/v1/ws/...  →  /ws/...
    # ----------------------------------------------------------
    location /api/v1/ws/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass         http://epay_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Request-ID $req_id;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----------------------------------------------------------
    # CSP violation report
    # ----------------------------------------------------------
    location /api/csp-report {
        limit_req zone=api_limit burst=30 nodelay;
        if ($request_method != POST) { return 405; }
        access_log /var/log/nginx/csp-violations.log security_log;
        return 204;
    }

    # ----------------------------------------------------------
    # Nginx status (internal only)
    # ----------------------------------------------------------
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
    }

    # ----------------------------------------------------------
    # Security blocks & error pages
    # ----------------------------------------------------------
    include /etc/nginx/conf.d/12-security-blocks.conf;
    include /etc/nginx/conf.d/11-error-pages.conf;

    # ----------------------------------------------------------
    # Catch-all — 404 for anything not matched above
    # ----------------------------------------------------------
    location / {
        default_type application/json;
        return 404 '{"errorCode":"RES_15001","message":"Endpoint not found. Use /api/v1/ prefix.","status":404,"success":false}';
    }
}
