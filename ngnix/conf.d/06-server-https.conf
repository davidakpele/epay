        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS)$) {
            return 405 '{"error":"Method not allowed","code":"METHOD_NOT_ALLOWED","request_id":"$req_id"}';
        }

        client_max_body_size  10M;
        client_body_buffer_size 128k;

        rewrite ^/api/v1/(.*)$ /$1 break;

        proxy_pass            http://epay_backend;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID $req_id;
        proxy_redirect        off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        access_log /var/log/nginx/user.log security_log;
        error_page 502 503 504 = @service_unavailable;
    }

